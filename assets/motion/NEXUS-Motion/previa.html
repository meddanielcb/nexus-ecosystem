<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS • Motion</title><style>body{margin:0;background:#050607;color:#f5f7f4;font:16px system-ui;padding:32px}main{max-width:960px;margin:auto}h1{font-size:32px}section{display:flex;flex-wrap:wrap;gap:24px}article{flex:1;min-width:260px;background:#101315;border:1px solid #ffffff20;border-radius:24px;padding:24px;text-align:center}video{width:100%;max-width:360px;border-radius:50%}object{width:200px;height:200px;display:block;margin:80px auto}button{background:#b7ff3c;border:0;border-radius:20px;padding:12px 24px;font:inherit;cursor:pointer}p{color:#a8b0aa}</style><main><h1>NEXUS em movimento.</h1><p>Perfil em vídeo e carregamento vetorial.</p><section><article><video id="v" src="nexus-orbita-luz.mp4" muted loop playsinline controls preload="metadata"></video><h2>Órbita • 6 segundos</h2><p>Vídeo quadrado, com prévia circular.</p></article><article><object id="loader" type="image/svg+xml" data="nexus-loader.svg" aria-label="Símbolo NEXUS animado"></object><h2>Loader vetorial</h2><p>Transparente. Respeita redução de movimento.</p></article></section><p><button id="toggle" aria-pressed="false">Reproduzir animações</button></p></main><script>const v=document.querySelector('video'),b=document.querySelector('button'),o=document.querySelector('object');let playing=false;function set(p){playing=p;b.textContent=p?'Pausar animações':'Reproduzir animações';b.setAttribute('aria-pressed',String(p));if(p)v.play().catch(()=>{});else v.pause();try{o.contentDocument.querySelectorAll('.orbit,.n').forEach(e=>e.style.animationPlayState=p?'running':'paused')}catch{}}b.onclick=()=>set(!playing);o.onload=()=>set(playing);document.addEventListener('visibilitychange',()=>{if(document.hidden)set(false)});const m=matchMedia('(prefers-reduced-motion: reduce)');m.addEventListener('change',()=>{if(m.matches)set(false)});if(!m.matches)set(true);</script></html>

# ==========================================================
# NEXUS PLAYTV — NÓ DE BORDA SÃO PAULO (ROTEAMENTO DIRETO LOCAL)
# Streaming de vídeo: SP direto para atmt.space (GRU - 38ms)
# Aplicação/Dados: Repasse seguro para a Suécia via WireGuard
# Memória RAM (/dev/shm): Cache volátil para transmissões
# ==========================================================

limit_req_zone $binary_remote_addr zone=REQ_LIMIT:20m rate=40r/s;
limit_req_zone $binary_remote_addr zone=LOGIN_LIMIT:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=CONN_LIMIT:20m;

# Cache em RAM para chunks de vídeo
proxy_cache_path /dev/shm/nexus_edge_cache levels=1:2 keys_zone=EDGE_CACHE:30m max_size=500m inactive=60s use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name play.nexusplay.tv sp.nexusplay.tv 216.128.168.218;

    location = /health {
        access_log off;
        return 200 'NEXUS_EDGE_SP_ONLINE\n';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name play.nexusplay.tv sp.nexusplay.tv;

    ssl_certificate     /etc/letsencrypt/live/nexusplay.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexusplay.tv/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log off;
    error_log /dev/null crit;

    # Bloqueio de ferramentas de ataque
    if ($http_user_agent ~* (sqlmap|nikto|wpscan|masscan|zgrab|nmap|dirbuster|gobuster|python-requests|aiohttp|scrapy)) {
        return 403;
    }

    limit_conn CONN_LIMIT 50;

    location = /health {
        return 200 'NEXUS_EDGE_SP_HTTPS_ONLINE\n';
        add_header Content-Type text/plain;
    }

    # ---------- ROTA DE STREAMING DE VÍDEO DIRETA (SP -> GRU) ----------
    # Puxa o canal ao vivo direto do CDN de São Paulo (38ms) sem passar pela Suécia!
    # NUNCA aplicar limit_req em vídeo para não estrangular chunks e causar engasgos
    location ^~ /stream/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=utf-8";
            return 204;
        }

        proxy_pass http://atmt.space/;
        proxy_http_version 1.1;
        proxy_set_header Host atmt.space;
        proxy_set_header User-Agent "IPTVSmartersPro/2.2.2 (Linux; Android 10)";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_ignore_client_abort off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering "no" always;

        proxy_redirect off;
        proxy_ignore_headers Set-Cookie Cache-Control;
        proxy_hide_header Set-Cookie;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Nexus-Route "DIRECT-SP-GRU" always;
    }

    # ---------- DEMAIS ROTAS (WebPlayer, API EPG, Pareamento QR, Ops) ----------
    # Vão para o backend seguro da Suécia via túnel WireGuard
    location / {
        limit_req zone=REQ_LIMIT burst=40 nodelay;

        proxy_pass https://10.10.50.1:443;
        proxy_ssl_server_name on;
        proxy_set_header Host play.nexusplay.tv;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }
}

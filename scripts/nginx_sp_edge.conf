# ==========================================================
# NEXUS PLAYTV — NÓ DE BORDA SÃO PAULO (EDGE TURBO)
# Cache em Memória RAM (/dev/shm) + Proxy Criptografado WireGuard
# Zero Gravação de Logs em Disco (Blindagem Total)
# ==========================================================

# Zona de cache em memoria RAM (/dev/shm) para blocos de video .ts
proxy_cache_path /dev/shm/nexus_edge_cache levels=1:2 keys_zone=EDGE_CACHE:30m max_size=400m inactive=60s use_temp_path=off;

# Redirecionamento HTTP -> HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log off;
    error_log /dev/null crit;

    location /health {
        add_header Content-Type text/plain;
        return 200 'NEXUS_EDGE_SP_ONLINE\n';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS com certificado oficial Nexus
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name play.nexusplay.tv nexusplay.tv sp.nexusplay.tv _;

    access_log off;
    error_log /dev/null crit;

    ssl_certificate     /etc/letsencrypt/live/nexusplay.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexusplay.tv/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;

    location /health {
        add_header Content-Type text/plain;
        return 200 'NEXUS_EDGE_SP_HTTPS_ONLINE\n';
    }

    # Cache de video acelerado em RAM (.ts)
    location ~* \.(ts|m4s)$ {
        proxy_pass https://10.10.50.1:443;
        proxy_ssl_server_name on;
        proxy_set_header Host play.nexusplay.tv;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache EDGE_CACHE;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Nexus-Cache $upstream_cache_status;

        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # Streaming ao vivo direto sem buffering (MPEG-TS / HLS)
    location ^~ /stream/ {
        proxy_pass https://10.10.50.1:443;
        proxy_ssl_server_name on;
        proxy_set_header Host play.nexusplay.tv;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Demais requisicoes (WebPlayer HTML, JS, CSS, QR Pair, EPG)
    location / {
        proxy_pass https://10.10.50.1:443;
        proxy_ssl_server_name on;
        proxy_set_header Host play.nexusplay.tv;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}

# ==========================================================
# NEXUS PLAYTV — NÓ DE BORDA SÃO PAULO (EDGE TURBO BLINDADO)
# Proteção Anti-DDoS, Rate Limiting, Anti-Scraping, Cache em RAM
# Zero Gravação de Logs em Disco (100% Blindagem e Anonimato)
# ==========================================================

# 1. Zonas de Rate Limiting na Memória RAM
# Limita requisições abusivas de concorrentes ou robôs de varredura
limit_req_zone $binary_remote_addr zone=REQ_LIMIT:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=LOGIN_LIMIT:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=CONN_LIMIT:20m;

# 2. Cache em Memória RAM Volátil (/dev/shm)
proxy_cache_path /dev/shm/nexus_edge_cache levels=1:2 keys_zone=EDGE_CACHE:30m max_size=500m inactive=60s use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name play.nexusplay.tv sp.nexusplay.tv 216.128.168.218;

    # Healthcheck para balanceadores e monitoramento
    location = /health {
        access_log off;
        return 200 'NEXUS_EDGE_SP_ONLINE\n';
        add_header Content-Type text/plain;
    }

    # Redireciona todo o tráfego HTTP para HTTPS seguro
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name play.nexusplay.tv sp.nexusplay.tv;

    # Certificado SSL oficial Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/nexusplay.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexusplay.tv/privkey.pem;

    # Parâmetros TLS modernos e seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers de Segurança e Privacidade Máxima
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Zero Logs em Disco (Privacidade Absoluta)
    access_log off;
    error_log /dev/null crit;

    # 3. Bloqueio de Scrapers, Ferramentas de Ataque e Varreduras de Concorrentes
    if ($http_user_agent ~* (sqlmap|nikto|wpscan|masscan|zgrab|nmap|dirbuster|gobuster|python-requests|aiohttp|scrapy)) {
        return 403;
    }

    # Limite global de conexões simultâneas por IP (impede exaustão de sockets)
    limit_conn CONN_LIMIT 50;

    # Rota de Healthcheck segura
    location = /health {
        return 200 'NEXUS_EDGE_SP_HTTPS_ONLINE\n';
        add_header Content-Type text/plain;
    }

    # Telemetria restrita: apenas acessível via loopback ou IP de túnel
    location /telemetry/ {
        allow 127.0.0.1;
        allow 10.10.50.0/24;
        deny all;
        proxy_pass http://127.0.0.1:5057/;
    }

    # Segmentos de Vídeo (.ts / .m4s) — Cache Agressivo em RAM + Anti-Buffering
    location ~* \.(ts|m4s|mp4)$ {
        # Proteção contra requisições simultâneas em massa no mesmo IP
        limit_req zone=REQ_LIMIT burst=50 nodelay;

        proxy_pass https://10.10.50.1:443;
        proxy_ssl_server_name on;
        proxy_set_header Host play.nexusplay.tv;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache em Memória RAM
        proxy_cache EDGE_CACHE;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Nexus-Cache $upstream_cache_status;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }

    # Playlists HLS (.m3u8) — Entrega Instantânea (Sem Cache para manter ao vivo)
    location ~* \.m3u8$ {
        limit_req zone=REQ_LIMIT burst=30 nodelay;

        proxy_pass https://10.10.50.1:443;
        proxy_ssl_server_name on;
        proxy_set_header Host play.nexusplay.tv;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
    }

    # Proteção especial de Login (Anti-Brute Force de credenciais)
    location ~* (login|auth|api/login) {
        limit_req zone=LOGIN_LIMIT burst=10 nodelay;

        proxy_pass https://10.10.50.1:443;
        proxy_ssl_server_name on;
        proxy_set_header Host play.nexusplay.tv;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # Demais requisições (WebPlayer HTML, JS, CSS, QR Pair, EPG, Ops Guardian)
    location / {
        limit_req zone=REQ_LIMIT burst=40 nodelay;

        proxy_pass https://10.10.50.1:443;
        proxy_ssl_server_name on;
        proxy_set_header Host play.nexusplay.tv;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }
}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080B10">
<title>Nexus PlayTV • WebPlayer</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
  :root{
    --bg:#070A0D; --panel:#0D1117; --panel2:#111722; --border:#1C2530;
    --cyan:#00E5FF; --green:#39FF88; --text:#E6EDF3; --muted:#7C8896;
    --danger:#FF4D6D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 20% -10%, rgba(0,229,255,0.08), transparent 40%),
               radial-gradient(circle at 100% 110%, rgba(57,255,136,0.06), transparent 45%),
               var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  a{color:var(--cyan);text-decoration:none;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#1C2530;border-radius:8px;}

  /* ---------- TOPBAR ---------- */
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;border-bottom:1px solid var(--border);
    background:rgba(7,10,13,0.85);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;font-size:16px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
  .brand b{color:var(--cyan);}
  .status-pill{
    font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;
    background:#101820;border:1px solid var(--border);color:var(--muted);
    display:flex;align-items:center;gap:6px;
  }
  .status-pill.live{color:var(--green);border-color:rgba(57,255,136,0.35);}
  .status-pill.err{color:var(--danger);border-color:rgba(255,77,109,0.35);}

  /* ---------- LAYOUT ---------- */
  main{flex:1;display:flex;min-height:0;}
  .stage{
    flex:1;display:flex;flex-direction:column;min-width:0;
    padding:18px;gap:14px;
  }
  .player-wrap{
    position:relative;width:100%;aspect-ratio:16/9;background:#000;
    border-radius:16px;overflow:hidden;border:1px solid var(--border);
    box-shadow:0 20px 60px rgba(0,0,0,0.55);
  }
  video{width:100%;height:100%;background:#000;display:block;}
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:rgba(4,6,9,0.75);
    text-align:center;padding:24px;
  }
  .overlay.hidden{display:none;}
  .spinner{
    width:42px;height:42px;border-radius:50%;
    border:3px solid rgba(0,229,255,0.15);border-top-color:var(--cyan);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .overlay p{color:var(--muted);font-size:13px;max-width:340px;}
  .overlay .big{color:var(--text);font-weight:700;font-size:15px;}
  .btn{
    background:linear-gradient(135deg,var(--cyan),#0088FF);color:#04161B;
    font-weight:800;border:none;border-radius:12px;padding:12px 22px;
    font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(0,229,255,0.35);
  }
  .btn.ghost{background:#141C26;color:var(--text);border:1px solid var(--border);box-shadow:none;}
  .btn:active{transform:scale(.97);}

  .meta-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .now-playing{font-size:15px;font-weight:800;}
  .now-playing span{color:var(--muted);font-weight:500;font-size:12px;display:block;margin-top:2px;}
  .controls-row{display:flex;gap:8px;flex-wrap:wrap;}
  .icon-btn{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .icon-btn:hover{border-color:var(--cyan);color:var(--cyan);}

  /* ---------- SIDEBAR ---------- */
  aside.sidebar{
    width:320px;flex-shrink:0;border-left:1px solid var(--border);
    display:flex;flex-direction:column;background:rgba(13,17,23,0.5);
  }
  .side-head{padding:14px 16px;border-bottom:1px solid var(--border);}
  .side-search{
    width:100%;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:9px 12px;font-size:13px;outline:none;
  }
  .side-search:focus{border-color:var(--cyan);}
  .cat-select{
    width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:8px 10px;font-size:12px;outline:none;
  }
  .list{flex:1;overflow-y:auto;padding:8px;}
  .chan{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
    cursor:pointer;font-size:13px;color:var(--text);
  }
  .chan:hover{background:var(--panel2);}
  .chan.active{background:rgba(0,229,255,0.1);color:var(--cyan);border:1px solid rgba(0,229,255,0.25);}
  .chan .logo{width:28px;height:28px;border-radius:6px;background:#141C26;flex-shrink:0;object-fit:contain;}
  .chan .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .empty-hint{padding:24px 16px;color:var(--muted);font-size:12px;text-align:center;line-height:1.6;}

  /* ---------- LOGIN GATE ---------- */
  #loginGate{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  #loginGate.hidden{display:none;}
  .login-card{
    width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);
    border-radius:20px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .login-card h1{font-size:20px;text-align:center;color:var(--cyan);letter-spacing:.5px;font-weight:800;}
  .login-card .sub{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 22px;}
  .field{margin-bottom:14px;}
  .field label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
  .field input{
    width:100%;margin-top:6px;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;
  }
  .field input:focus{border-color:var(--cyan);}
  .login-card .btn{width:100%;margin-top:6px;}
  .login-err{color:var(--danger);font-size:12px;margin-top:10px;text-align:center;display:none;}
  .login-foot{margin-top:18px;text-align:center;font-size:11px;color:var(--muted);}

  @media (max-width:860px){
    aside.sidebar{position:fixed;right:0;top:53px;bottom:0;width:86%;max-width:340px;
      transform:translateX(100%);transition:transform .25s ease;z-index:40;box-shadow:-10px 0 30px rgba(0,0,0,0.5);}
    aside.sidebar.open{transform:translateX(0);}
    main{position:relative;}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN GATE ===================== -->
<div id="loginGate">
  <div class="login-card">
    <h1>NEXUS <b style="color:var(--green)">PLAY</b></h1>
    <p class="sub">WebPlayer oficial • play.nexusplay.tv</p>
    <div class="field">
      <label>Usuário</label>
      <input id="inUser" type="text" autocomplete="username" placeholder="seu usuário Xtream">
    </div>
    <div class="field">
      <label>Senha</label>
      <input id="inPass" type="password" autocomplete="current-password" placeholder="sua senha">
    </div>
    <button class="btn" id="btnLogin">▶ Entrar e Assistir</button>
    <p class="login-err" id="loginErr"></p>
    <p class="login-foot">Recebeu um link de acesso rápido? Ele já loga sozinho.<br>Suporte: Nexus PlayTV</p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<header class="topbar">
  <div class="brand"><span class="dot"></span>NEXUS <b>PLAY</b></div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span class="status-pill" id="statusPill">● conectando…</span>
    <button class="icon-btn" id="btnToggleList" style="display:none;">📺 Canais</button>
    <button class="icon-btn" id="btnLogout">Sair</button>
  </div>
</header>

<main>
  <section class="stage">
    <div class="player-wrap">
      <video id="video" playsinline controls></video>
      <div class="overlay" id="overlay">
        <div class="spinner"></div>
        <p class="big" id="overlayTitle">Carregando WebPlayer…</p>
        <p id="overlayMsg">Conectando ao servidor de streaming seguro.</p>
      </div>
    </div>
    <div class="meta-row">
      <div class="now-playing">
        <span id="npChannel">Nenhum canal selecionado</span>
        <span id="npUser"></span>
      </div>
      <div class="controls-row">
        <button class="icon-btn" id="btnFullscreen">⛶ Tela Cheia</button>
        <button class="icon-btn" id="btnReload">⟲ Recarregar</button>
      </div>
    </div>
  </section>

  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <input class="side-search" id="searchInput" placeholder="🔎 Buscar canal…">
      <select class="cat-select" id="catSelect"><option value="">Todas as categorias</option></select>
    </div>
    <div class="list" id="channelList">
      <div class="empty-hint">Faça login para carregar a lista de canais.</div>
    </div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script src="/app.js"></script>
</body>
</html>

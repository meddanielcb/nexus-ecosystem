# ============================================================
# play.nexusplay.tv — WebPlayer Nexus + Proxy Anti-CORS/Mixed Content
# Repassa transparentemente para o provedor de streaming (HTTP puro)
# através de HTTPS same-origin, injetando cabeçalhos CORS e evitando
# bloqueio de Mixed Content nos navegadores.
# ============================================================

# NOTA IMPORTANTE (armadilha conhecida do Nginx):
# proxy_pass NÃO deve usar variável para o host aqui. Quando o destino do
# proxy_pass é montado com variável, o Nginx deixa de decapar o prefixo do
# location (ex.: "/stream/") e repassa a URI completa ao upstream — que
# nesse caso não tem rota "/stream/player_api.php" e cai no fallback SPA.
# Por isso o upstream é literal ("http://atmt.space/"), garantindo a
# decapagem correta de "/stream/" -> "/". Se o IP do Cloudflare por trás
# de atmt.space mudar, um "systemctl reload nginx" já reresolve o DNS.

server {
    listen 80;
    listen [::]:80;
    server_name play.nexusplay.tv;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.nexusplay.tv;

    ssl_certificate     /etc/letsencrypt/live/nexusplay.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexusplay.tv/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/play.nexusplay.tv;
    index index.html;

    access_log /var/log/nginx/play.nexusplay.tv.access.log;
    error_log  /var/log/nginx/play.nexusplay.tv.error.log;

    # ---------- WebPlayer estático (HTML/JS/CSS) ----------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ---------- PROXY SEGURO ANTI-CORS / MIXED CONTENT ----------
    # https://play.nexusplay.tv/stream/<qualquer-rota-xtream>
    #   -> http://atmt.space/<qualquer-rota-xtream>
    # Cobre: player_api.php, get.php (M3U), live/<user>/<pass>/<id>.m3u8,
    # segmentos .ts/.m3u8 e VOD/series.
    location /stream/ {
        # Resposta imediata ao preflight CORS
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=utf-8";
            return 204;
        }

        proxy_pass http://atmt.space/;
        proxy_http_version 1.1;
        proxy_set_header Host atmt.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming HLS/MPEG-TS suave: sem buffering excessivo, sem
        # cache indevido de segmentos ao vivo.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-Accel-Buffering "no" always;

        # Nunca repassar cookies/redirects do upstream para o navegador
        proxy_redirect off;
        proxy_ignore_headers Set-Cookie Cache-Control;
        proxy_hide_header Set-Cookie;

        # Cabeçalhos CORS injetados em toda resposta (GET real)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
